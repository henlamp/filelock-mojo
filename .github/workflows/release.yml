name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    if: github.repository == 'henlamp/filelock-mojo'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
        with:
          version: 0.12.23
      - run: uv sync --locked
      - run: uv run python tools/check_all.py --report release
      - name: Build and test Conda package
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py build --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: filelock-mojo-release-${{ runner.os }}
          path: |
            .build/distributions/*/*.conda
            .build/distributions/release.json
          if-no-files-found: error
          include-hidden-files: true

  publish:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          run-install: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: filelock-mojo-release-${{ runner.os }}
          path: .build/distributions
      - name: Verify source and package
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py verify --tag "$RELEASE_TAG"
      - name: Publish to private channel using OIDC
        run: pixi exec --spec python=3.12.13 --spec rattler-build=0.76.1 -- python tools/release.py publish --tag "$RELEASE_TAG"
      - name: Install published package by name
        run: pixi exec --spec python=3.12.13 -- python tools/release.py installed --tag "$RELEASE_TAG" --channel https://prefix.dev/henlamp/mojo
