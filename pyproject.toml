[project]
name = "filelock-mojo-development"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
license = "MIT"

[dependency-groups]
dev = ["mojo==1.1.0", "ruff==0.16.10", "filelock==4.1.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "PLW"]
